    ColombiaBanksResponse:
      type: object
      required: [banks]
      properties:
        banks:
          type: array
          items:
            $ref: '#/components/schemas/ColombiaBank'

    ColombiaDocumentType:
      type: string
      enum: [cc, nit, ce, pa, ppt, ti, rc, te, die, nd]
      description: |
        `cc` cédula de cidadania, `nit` NIT, `ce` cédula de estrangeiro, `pa` passaporte, `ppt` PPT,
        `ti` carteira de identidade, `rc` registro civil, `te` carteira de estrangeiro,
        `die` documento de identificação estrangeiro, `nd` sem documento (Nequi).
        A maioria dos números é somente dígitos. Passaporte (`pa`) e PPT (`ppt`) são alfanuméricos.
        `nd` é só bancário e só para o código de banco `1507`. `documentNumber` deve ser `ND` e `phone` (E.164) é obrigatório.
        `nd` é rejeitado no Bre-B.

    ColombiaOutboundRequest:
      type: object
      description: |
        Payout de saída em COP. Omita `destinationType` ou envie `bank` para Fast Pay / ACH.
        Banco exige `accountType`, `bankCode`, `accountNumber` (máx. 20), `beneficiaryFullName`, `documentType` e `documentNumber`.
        O banco precisa aceitar Fast Pay ou ACH e o tipo de conta escolhido.
        `breb_key` exige `keyValue`, `beneficiaryFullName`, `documentType` e `documentNumber`. Não envie campos bancários.
        `breb_qr` exige `qrValue` (EMV ou base64). O nome do beneficiário é opcional.
        Envie `documentType` e `documentNumber` juntos, ou omita os dois. Enviar só um retorna `400`.
        Se o QR tiver um valor fixo, `amount` precisa coincidir ou a API retorna `400` com `code: BREB_QR_AMOUNT_MISMATCH`.
      required: [accountId, amount]
      properties:
        destinationType:
          type: string
          enum: [bank, breb_key, breb_qr]
          description: O padrão é `bank` quando omitido
        accountId:
          type: string
          format: uuid
          example: YOUR_ACCOUNT_UUID
        amount:
          description: |
            Valor positivo. Uma string aceita no máximo 2 casas decimais. Mais de 2 casas decimais retorna `400` com `details` do campo `amount` (`Invalid amount format`).
            Um número JSON com mais de 2 casas decimais é truncado em direção a zero para 2 casas decimais (`1.239` vira `1.23`).
            Se o valor truncado não for maior que zero, a API retorna `400` com `error: "Validation failed"` e `details` do campo `amount`.
          oneOf:
            - type: number
              exclusiveMinimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        accountType:
          type: string
          enum: [cc, ch, dp]
          description: Obrigatório para banco. `cc` corrente, `ch` poupança, `dp` depósito eletrônico.
        bankCode:
          type: string
          pattern: "^\\d{4}$"
          description: Obrigatório para banco. Código de 4 dígitos de GET /co/banks.
        accountNumber:
          type: string
          maxLength: 20
          description: Obrigatório para banco
        beneficiaryFullName:
          type: string
          description: Obrigatório para banco e chave Bre-B. Opcional para QR Bre-B.
        documentType:
          $ref: '#/components/schemas/ColombiaDocumentType'
        documentNumber:
          type: string
        keyValue:
          type: string
          description: Obrigatório para `breb_key`
        qrValue:
          type: string
          description: Obrigatório para `breb_qr`. Payload EMV ou base64.
        phone:
          type: string
          description: Telefone E.164 opcional. Obrigatório quando `documentType` é `nd`.
          example: "+570000000000"
        email:
          type: string
          format: email
          example: payer@example.com
        description:
          type: string
          maxLength: 40
        webhookUrl:
          type: string
          format: uri

    ColombiaOutboundResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing]

