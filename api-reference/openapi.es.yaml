              format: uri
              nullable: true
              description: URL firmada de duración limitada (~7 días) para descargar el comprobante.
            updatedAt:
              type: string
              format: date-time

    ClaimStatusWebhook:
      type: object
      description: |
        Payload enviado a tu endpoint de webhook cuando cambia el estado de un reclamo (actualización de un administrador o autoconciliación por COELSA).

        **Cabeceras:** Cuando configuras un secreto de firma de webhook en la configuración de la cuenta, HG.Cash envía la cabecera `X-HG-Webhook-Signature: sha256=<hex>`, cuyo valor es el HMAC-SHA256 del cuerpo JSON en crudo usando tu secreto. Verifícalo para asegurar que la solicitud es auténtica.

        Notas:
        - Los valores numéricos (como `amount`) se envían como cadenas para preservar la precisión.
        - `fileUrl` no se incluye (las URL firmadas expiran).
        - No se envían webhooks al crear un reclamo ni en actualizaciones que solo agregan un comentario.
        - Configura tu URL de webhook en la configuración de usuario.
      required:
        - topic
        - eventType
        - id
        - status
        - operationNumber
        - coelsaCode
        - amount
        - currency
        - extractedData
        - originalFilename
        - mimeType
        - createdAt
        - updatedAt
      properties:
        topic:
          type: string
          description: Tema del webhook para enrutamiento (siempre `CLAIM` para webhooks de reclamos)
          enum: [CLAIM]
          example: "CLAIM"
        eventType:
          type: string
          description: Tipo de evento dentro del tema
          enum: [status_change]
          example: "status_change"
        id:
          type: string
          format: uuid
          description: ID del reclamo
        status:
          type: string
          enum: [OPEN, UNDER_REVIEW, RESOLVED, REJECTED]
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: ID de la transacción vinculada cuando la conciliación encontró un match
        operationNumber:
          type: string
        coelsaCode:
          type: string
        amount:
          type: string
          nullable: true
          description: Monto decimal con 2 decimales
        currency:
          type: string
          enum: [ARS, USD, USDT]
        extractedData:
          type: object
          properties:
            from:
              type: string
              nullable: true
            to:
              type: string
              nullable: true
        originalFilename:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        comment:
          type: string
          description: Texto del último comentario cuando la actualización de estado incluyó un comentario (se elimina el prefijo de marca de tiempo ISO)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

