                  metadata: { adapterTransactionId: "in1345115478", user_id: "109659669" }
                  completedAt: "2026-08-10T06:02:57.136Z"
  claim-status-updated:
    post:
      summary: Status da reclamação atualizado
      description: |
        A HG.Cash envia este webhook quando o status de uma reclamação muda (atualização de um administrador ou autoconciliação por COELSA).
        O corpo corresponde aos campos de `GET /claims/{id}` (sem `fileUrl`) mais os metadados de roteamento. Webhooks não são enviados na criação nem em atualizações que apenas adicionam um comentário.
      operationId: claimStatusUpdatedWebhook
      tags:
        - Webhooks
      security:
        - webhookHmac: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimStatusWebhook'
            examples:
              resolved:
                summary: Reclamação resolvida com transação vinculada
                value:
                  topic: "CLAIM"
