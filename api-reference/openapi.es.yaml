    ColombiaDocumentType:
      type: string
      enum: [cc, nit, ce, pa, ppt, ti, rc, te, die, nd]
      description: |
        `cc` cédula de ciudadanía, `nit` NIT, `ce` cédula de extranjería, `pa` pasaporte, `ppt` PPT,
        `ti` tarjeta de identidad, `rc` registro civil, `te` tarjeta de extranjería,
        `die` documento de identificación extranjero, `nd` sin documento (Nequi).
        La mayoría de los números son solo dígitos. Pasaporte (`pa`) y PPT (`ppt`) son alfanuméricos.
        `nd` es solo bancario y solo para el código de banco `1507`. `documentNumber` debe ser `ND` y `phone` (E.164) es obligatorio.
        `nd` se rechaza en Bre-B.

    ColombiaOutboundRequest:
      type: object
      description: |
        Payout saliente en COP. Omita `destinationType` o envíe `bank` para Fast Pay / ACH.
        Banco exige `accountType`, `bankCode`, `accountNumber` (máx. 20), `beneficiaryFullName`, `documentType` y `documentNumber`.
        El banco debe admitir Fast Pay o ACH y el tipo de cuenta elegido.
        `breb_key` exige `keyValue`, `beneficiaryFullName`, `documentType` y `documentNumber`. No envíe campos bancarios.
        `breb_qr` exige `qrValue` (EMV o base64). Beneficiario y documento son opcionales.
        Si el QR trae un monto fijo, `amount` debe coincidir o la API responde `400` con `code: BREB_QR_AMOUNT_MISMATCH`.
      required: [accountId, amount]
      properties:
        destinationType:
          type: string
          enum: [bank, breb_key, breb_qr]
          description: Si se omite, el valor es `bank`
        accountId:
          type: string
          format: uuid
          example: YOUR_ACCOUNT_UUID
        amount:
          description: Monto positivo. Los valores string admiten como máximo 2 decimales.
          oneOf:
            - type: number
              exclusiveMinimum: 0
            - type: string
              pattern: "^\\d+(\\.\\d{1,2})?$"
        accountType:
          type: string
          enum: [cc, ch, dp]
          description: Obligatorio para banco. `cc` corriente, `ch` ahorros, `dp` depósito electrónico.
        bankCode:
          type: string
          pattern: "^\\d{4}$"
          description: Obligatorio para banco. Código de 4 dígitos de GET /co/banks.
        accountNumber:
          type: string
          maxLength: 20
          description: Obligatorio para banco
        beneficiaryFullName:
          type: string
          description: Obligatorio para banco y llave Bre-B. Opcional para QR Bre-B.
        documentType:
          $ref: '#/components/schemas/ColombiaDocumentType'
        documentNumber:
          type: string
        keyValue:
          type: string
          description: Obligatorio para `breb_key`
        qrValue:
          type: string
          description: Obligatorio para `breb_qr`. Payload EMV o base64.
        phone:
          type: string
          description: Teléfono E.164 opcional. Obligatorio cuando `documentType` es `nd`.
          example: "+570000000000"
        email:
          type: string
          format: email
          example: payer@example.com
        description:
          type: string
          maxLength: 40
        webhookUrl:
          type: string
          format: uri

    ColombiaOutboundResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing]

    ColombiaValidationError:
      type: object
      required: [error, details]
      properties:
        error:
