    ClaimStatusWebhook:
      type: object
      description: |
        Payload enviado ao seu endpoint de webhook quando o status de uma reclamação muda (atualização de um administrador ou autoconciliação por COELSA).

        **Cabeçalhos:** Quando você configura um segredo de assinatura de webhook nas configurações da conta, a HG.Cash envia o cabeçalho `X-HG-Webhook-Signature: sha256=<hex>`, cujo valor é o HMAC-SHA256 do corpo JSON bruto usando seu segredo. Verifique-o para garantir que a solicitação é autêntica.

        Notas:
        - Valores numéricos (como `amount`) são enviados como strings para preservar a precisão.
        - `fileUrl` não é incluído (as URLs assinadas expiram).
        - Webhooks não são enviados na criação da reclamação nem em atualizações que apenas adicionam um comentário.
        - Configure a URL do seu webhook nas configurações de usuário.
      required:
        - topic
        - eventType
        - id
        - status
        - operationNumber
        - coelsaCode
        - amount
        - currency
        - extractedData
        - originalFilename
        - mimeType
        - createdAt
        - updatedAt
      properties:
        topic:
          type: string
          description: Tópico do webhook para roteamento (sempre `CLAIM` para webhooks de reclamações)
          enum: [CLAIM]
          example: "CLAIM"
        eventType:
          type: string
          description: Tipo de evento dentro do tópico
          enum: [status_change]
          example: "status_change"
        id:
          type: string
          format: uuid
          description: ID da reclamação
        status:
          type: string
          enum: [OPEN, UNDER_REVIEW, RESOLVED, REJECTED]
        accountId:
          type: string
          format: uuid
          nullable: true
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: ID da transação vinculada quando a conciliação encontrou um match
        operationNumber:
          type: string
        coelsaCode:
          type: string
        amount:
          type: string
          nullable: true
          description: Valor decimal com 2 casas decimais
        currency:
          type: string
          enum: [ARS, USD, USDT]
        extractedData:
          type: object
          properties:
            from:
              type: string
              nullable: true
            to:
              type: string
              nullable: true
        originalFilename:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        comment:
          type: string
          description: Texto do último comentário quando a atualização de status incluiu um comentário (o prefixo de timestamp ISO é removido)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

