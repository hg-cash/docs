  /bo/transactions/inbound:
    post:
      summary: Crear transacción entrante (Bolivia)
      description: |
        Crea una transacción entrante en BOB y devuelve un código QR (imagen base64) para el pagador.
        La cuenta debe usar moneda BOB y país BO.
